<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Parthasarathy T (Partha) — Forward Deployed Engineer specializing in GCP cloud infrastructure, DevOps, and client solutions." />
  <meta name="author" content="Parthasarathy T" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Parthasarathy T — Forward Deployed Engineer" />
  <meta property="og:description" content="GCP Cloud Infrastructure · DevOps · Client Solutions" />

  <!-- Title is set dynamically from data.js, with a static fallback -->
  <title>Parthasarathy T — Forward Deployed Engineer</title>

  <!-- Preconnect + Google Fonts: Playfair Display (headings) + Inter (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>

  <!-- ============================================================= -->
  <!-- PRELOADER — gold line draw, then fades into hero              -->
  <!-- ============================================================= -->
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader__line"></div>
    <div class="preloader__name" id="preloaderName"></div>
  </div>

  <!-- Grain / noise overlay (purely decorative) -->
  <div class="grain" aria-hidden="true"></div>

  <!-- Cursor-reactive glow (desktop only, JS-controlled) -->
  <div class="cursor-glow" id="cursorGlow" aria-hidden="true"></div>

  <!-- ============================================================= -->
  <!-- NAV                                                           -->
  <!-- ============================================================= -->
  <header class="nav" id="nav">
    <a href="#hero" class="nav__brand" id="navBrand" aria-label="Home"></a>
    <nav class="nav__links" aria-label="Primary">
      <a href="#about" class="nav__link">About</a>
      <a href="#experience" class="nav__link">Experience</a>
      <a href="#projects" class="nav__link">Work</a>
      <a href="#skills" class="nav__link">Skills</a>
      <a href="#certifications" class="nav__link">Certifications</a>
    </nav>
    <a href="#" class="nav__cta" id="navCta" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    <button class="nav__toggle" id="navToggle" aria-label="Toggle menu" aria-expanded="false">
      <span></span><span></span>
    </button>
  </header>

  <main>
    <!-- ============================================================= -->
    <!-- HERO — canvas particle field injected by JS                  -->
    <!-- ============================================================= -->
    <section class="hero" id="hero">
      <canvas class="hero__canvas" id="heroCanvas" aria-hidden="true"></canvas>
      <div class="hero__inner" id="heroInner">
        <!-- Populated from profile{} -->
      </div>
      <div class="hero__scroll" aria-hidden="true">
        <span>Scroll</span>
        <div class="hero__scroll-line"></div>
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- ABOUT — populated from profile.about[] and profile.stats[]    -->
    <!-- ============================================================= -->
    <section class="section" id="about">
      <div class="section__head reveal">
        <span class="section__index">01</span>
        <h2 class="section__title">About</h2>
        <div class="hairline"></div>
      </div>
      <div class="about" id="aboutBody"><!-- rendered --></div>
      <div class="stats" id="statsStrip"><!-- rendered --></div>
    </section>

    <!-- ============================================================= -->
    <!-- EXPERIENCE — timeline rendered from experience[]              -->
    <!-- ============================================================= -->
    <section class="section" id="experience">
      <div class="section__head reveal">
        <span class="section__index">02</span>
        <h2 class="section__title">Experience</h2>
        <div class="hairline"></div>
      </div>
      <div class="timeline" id="timeline">
        <div class="timeline__progress" id="timelineProgress" aria-hidden="true"></div>
        <!-- rendered -->
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- PROJECTS — case-study cards from projects[]                   -->
    <!-- ============================================================= -->
    <section class="section" id="projects">
      <div class="section__head reveal">
        <span class="section__index">03</span>
        <h2 class="section__title">Selected Work</h2>
        <div class="hairline"></div>
      </div>
      <div class="projects" id="projectsGrid"><!-- rendered --></div>
    </section>

    <!-- ============================================================= -->
    <!-- SKILLS — grouped from skills{}                                -->
    <!-- ============================================================= -->
    <section class="section" id="skills">
      <div class="section__head reveal">
        <span class="section__index">04</span>
        <h2 class="section__title">Skills</h2>
        <div class="hairline"></div>
      </div>
      <div class="skills" id="skillsGrid"><!-- rendered --></div>
    </section>

    <!-- ============================================================= -->
    <!-- CERTIFICATIONS + EDUCATION + PUBLICATIONS                     -->
    <!-- ============================================================= -->
    <section class="section" id="certifications">
      <div class="section__head reveal">
        <span class="section__index">05</span>
        <h2 class="section__title">Certifications &amp; More</h2>
        <div class="hairline"></div>
      </div>

      <div class="creds">
        <div class="creds__col">
          <h3 class="creds__label reveal">Certifications</h3>
          <div id="certsList"><!-- rendered --></div>
        </div>
        <div class="creds__col">
          <h3 class="creds__label reveal">Education</h3>
          <div id="eduList"><!-- rendered --></div>

          <h3 class="creds__label reveal" style="margin-top:2.5rem">Publications</h3>
          <div id="pubList"><!-- rendered --></div>
        </div>
      </div>
    </section>

    <!-- ============================================================= -->
    <!-- CONTACT — single elegant LinkedIn CTA (only contact method)   -->
    <!-- ============================================================= -->
    <section class="section connect" id="connect">
      <div class="connect__inner reveal">
        <span class="section__index">06</span>
        <h2 class="connect__title">Let's connect.</h2>
        <p class="connect__text" id="connectText"></p>
        <a href="#" class="connect__cta" id="connectCta" target="_blank" rel="noopener noreferrer">
          <span>Find me on LinkedIn</span>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="1.5"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </div>
    </section>
  </main>

  <!-- ============================================================= -->
  <!-- FOOTER                                                        -->
  <!-- ============================================================= -->
  <footer class="footer">
    <div class="hairline"></div>
    <div class="footer__row">
      <span id="footerName"></span>
      <span id="footerNote">Built with care · GitHub Pages</span>
    </div>
  </footer>

  <!-- ============================================================= -->
  <!-- SCRIPTS — GSAP + ScrollTrigger via CDN, then data, then app   -->
  <!-- ============================================================= -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/main.js"></script>
</body>
</html>
