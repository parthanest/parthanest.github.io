# =============================================================================
# .github/workflows/cv-enhancer.yml
# -----------------------------------------------------------------------------
# Automated CV Enhancer pipeline.
#
# Triggered by a `repository_dispatch` event of type "cv-enhancer-request"
# fired from the portfolio front-end (js/cv-enhancer.js) — either directly
# or via the serverless proxy.
#
# Flow:
#   1. Receive client_payload { filename, content_base64, prompt, email }.
#   2. Decode the uploaded CV to disk.
#   3. Set up Python + install google-genai.
#   4. Run scripts/process_cv.py  (GEMINI_API_KEY <- secrets.LLM_API_KEY).
#   5. Upload the enhanced CV as a build artifact.
#   6. Emit a job summary; GitHub emails the run result to the account owner.
#
# Required repository secrets:
#   LLM_API_KEY  -> your Gemini API key   (mapped to GEMINI_API_KEY)
#   GH_PAT       -> used by the DISPATCHER (proxy/front-end), not this job
# =============================================================================

name: CV Enhancer

on:
  repository_dispatch:
    types: [cv-enhancer-request]

# Least-privilege: this job only needs to read the repo.
permissions:
  contents: read

concurrency:
  # One run per requesting email; newer requests cancel older queued ones.
  group: cv-enhancer-${{ github.event.client_payload.email }}
  cancel-in-progress: false

jobs:
  enhance:
    name: Enhance CV with Gemini
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # --- Payload from the dispatch event ---
      CV_FILENAME: ${{ github.event.client_payload.filename }}
      CV_PROMPT:   ${{ github.event.client_payload.prompt }}
      CV_EMAIL:    ${{ github.event.client_payload.email }}
      # --- Secret mapping: LLM_API_KEY -> GEMINI_API_KEY ---
      GEMINI_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      # 1) Checkout (needed for scripts/process_cv.py)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) Validate that required inputs are present
      - name: Validate payload
        run: |
          if [ -z "${CV_FILENAME}" ]; then echo "::error::Missing filename in payload"; exit 1; fi
          if [ -z "${GEMINI_API_KEY}" ]; then echo "::error::LLM_API_KEY secret is not set"; exit 1; fi
          echo "Request from: ${CV_EMAIL}"
          echo "File: ${CV_FILENAME}"

      # 3) Decode the base64 CV back into a real file under ./inbox/
      - name: Decode uploaded CV
        env:
          CV_CONTENT_B64: ${{ github.event.client_payload.content_base64 }}
        run: |
          mkdir -p inbox output
          printf '%s' "$CV_CONTENT_B64" | base64 -d > "inbox/${CV_FILENAME}"
          echo "Decoded $(wc -c < "inbox/${CV_FILENAME}") bytes -> inbox/${CV_FILENAME}"

      # 4) Python + dependencies
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # google-genai = official Gemini SDK; readers for docx/pdf
          pip install google-genai==0.8.0 python-docx==1.1.2 pypdf==4.3.1

      # 5) Run the enhancer. Reads inbox/<file>, writes output/<enhanced>.md
      - name: Enhance CV with Gemini
        run: |
          python scripts/process_cv.py \
            --input "inbox/${CV_FILENAME}" \
            --prompt "${CV_PROMPT}" \
            --email "${CV_EMAIL}" \
            --outdir "output"

      # 6) Upload the enhanced CV as a downloadable artifact
      - name: Upload enhanced CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: enhanced-cv
          path: output/
          retention-days: 14
          if-no-files-found: error

      # 7) Human-readable run summary (shown on the run page + in the email)
      - name: Write job summary
        if: always()
        run: |
          {
            echo "## 🧠 CV Enhancer — Run Summary"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Requester | ${CV_EMAIL} |"
            echo "| Source file | \`${CV_FILENAME}\` |"
            echo "| Prompt | ${CV_PROMPT} |"
            echo "| Status | ${{ job.status }} |"
            echo ""
            echo "➡️ Download the **enhanced-cv** artifact from the *Artifacts* section of this run."
          } >> "$GITHUB_STEP_SUMMARY"

# -----------------------------------------------------------------------------
