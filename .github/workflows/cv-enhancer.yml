# =============================================================================
# .github/workflows/cv-enhancer.yml
# -----------------------------------------------------------------------------
# CI for the CV Enhancer backend: installs deps and syntax-checks the server
# so the Node service stays deployable. (Email sending is NOT run in CI.)
#
# The Gmail App Password is provided to the RUNTIME host as an env var/secret
# (GMAIL_APP_PASSWORD), never printed in logs and never needed at build time.
# =============================================================================

name: CV Enhancer Backend CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/cv-enhancer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install & syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: server
        run: npm install

      - name: Syntax-check server files
        working-directory: server
        run: |
          node --check server.js
          node --check mailer.js
          echo "✅ Backend files parse cleanly."
